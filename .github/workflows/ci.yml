name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }} | ${{ matrix.build_type }} | ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows (MSVC)
          - os: windows-latest
            build_type: Debug
            compiler: msvc
          - os: windows-latest
            build_type: Release
            compiler: msvc
          # Ubuntu (GCC)
          - os: ubuntu-latest
            build_type: Debug
            compiler: gcc
          - os: ubuntu-latest
            build_type: Release
            compiler: gcc
          # Ubuntu (Clang)
          - os: ubuntu-latest
            build_type: Debug
            compiler: clang
          - os: ubuntu-latest
            build_type: Release
            compiler: clang
          # macOS (Clang)
          - os: macos-latest
            build_type: Debug
            compiler: clang
          - os: macos-latest
            build_type: Release
            compiler: clang
          # macOS (Intel) for broader coverage when available
          - os: macos-13
            build_type: Debug
            compiler: clang
          - os: macos-13
            build_type: Release
            compiler: clang
    env:
      BUILD_TYPE: ${{ matrix.build_type }}
      COMPILER: ${{ matrix.compiler }}
      ROGUE_ENABLE_SDL: ON
      CMAKE_BUILD_PARALLEL_LEVEL: "12" # Ensure full parallelism for CMake builds across all runners
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows
      CI_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: ver
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci/compute-version.ps1 -OutDir build -WriteGithubOutputs

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v1

      - name: Cache CMake build (per-OS/Compiler/Config)
        uses: actions/cache@v4
        with:
          path: |
            build
          key: ${{ runner.os }}-cmake-${{ env.BUILD_TYPE }}-${{ env.COMPILER }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**', 'tests/**') }}
          restore-keys: |
            ${{ runner.os }}-cmake-${{ env.BUILD_TYPE }}-${{ env.COMPILER }}-

      - name: Cache ccache (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ env.BUILD_TYPE }}-${{ env.COMPILER }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**', 'tests/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ env.BUILD_TYPE }}-${{ env.COMPILER }}-

      # Windows-specific setup
      - name: Setup MSVC Developer Command Prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install -y ninja || echo "ninja already installed"

      - name: Install clang-format (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y llvm || echo "llvm already installed"
          if (Get-Command clang-format -ErrorAction SilentlyContinue) { clang-format --version }

      - name: Install SDL via vcpkg (x64-windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Log dependency setup to build/deps_windows.txt for troubleshooting
          if (-not (Test-Path build)) { New-Item -ItemType Directory -Path build | Out-Null }
          # Always use a local classic vcpkg instance to avoid manifest-mode-only runner instances
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'vcpkg'
          if (-Not (Test-Path $vcpkgRoot)) {
            git clone https://github.com/microsoft/vcpkg $vcpkgRoot
            & "$vcpkgRoot\bootstrap-vcpkg.bat"
          }
          $env:VCPKG_ROOT = $vcpkgRoot
          $vcpkgExe = Join-Path $env:VCPKG_ROOT 'vcpkg.exe'
          # Persist VCPKG_ROOT for subsequent steps
          "VCPKG_ROOT=$env:VCPKG_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $vcpkgExe version 2>&1 | Tee-Object -FilePath build/deps_windows.txt -Append | Out-Null
          & $vcpkgExe install sdl2 sdl2-image sdl2-mixer --triplet $env:VCPKG_DEFAULT_TRIPLET 2>&1 | Tee-Object -FilePath build/deps_windows.txt -Append | Out-Null
          choco --version 2>&1 | Tee-Object -FilePath build/deps_windows.txt -Append | Out-Null

      - name: Show SDL2 version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkgExe = Join-Path $env:VCPKG_ROOT 'vcpkg.exe'
          & $vcpkgExe list sdl2 2>&1 | Tee-Object -FilePath build/deps_windows.txt -Append | Out-Null
          Get-ChildItem "$env:VCPKG_ROOT\installed\x64-windows\bin" -Filter SDL2.dll -ErrorAction SilentlyContinue | Select-Object FullName, Length | Out-String | Tee-Object -FilePath build/deps_windows.txt -Append | Out-Null

      # Ubuntu-specific setup
      - name: Install Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          set -Eeuo pipefail
          mkdir -p build
          export DEBIAN_FRONTEND=noninteractive
          # Apply retries and network timeouts to avoid indefinite stalls
          timeout 10m sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update 2>&1 | tee build/deps_linux.txt
          timeout 20m sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y cmake ninja-build build-essential pkg-config ccache clang clang-tidy \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev \
            xvfb 2>&1 | tee -a build/deps_linux.txt
          echo "-- Versions --" | tee -a build/deps_linux.txt
          cmake --version | tee -a build/deps_linux.txt
          ninja --version | tee -a build/deps_linux.txt
          gcc --version | head -n1 | tee -a build/deps_linux.txt || true
          clang --version | head -n1 | tee -a build/deps_linux.txt || true
          pkg-config --modversion sdl2 sdl2_image sdl2_mixer 2>/dev/null | paste -sd "," - | sed 's/^/pkg-config: /' | tee -a build/deps_linux.txt

      - name: Show SDL2 version (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          set -Eeuo pipefail
          echo "pkg-config versions:"
          pkg-config --modversion sdl2 || true
          pkg-config --modversion sdl2_image || true
          pkg-config --modversion sdl2_mixer || true
          echo "sdl2-config (if present):"
          sdl2-config --version || true

      # macOS-specific setup
      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          set -Eeuo pipefail
          mkdir -p build
          # Reduce flakiness and long updates during CI
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          export HOMEBREW_NO_ENV_HINTS=1
          brew update 2>&1 | tee build/deps_macos.txt
          brew install cmake ninja sdl2 sdl2_image sdl2_mixer ccache llvm pkg-config 2>&1 | tee -a build/deps_macos.txt || true
          echo "-- Versions --" | tee -a build/deps_macos.txt
          cmake --version | tee -a build/deps_macos.txt
          ninja --version | tee -a build/deps_macos.txt
          clang --version | head -n1 | tee -a build/deps_macos.txt || true
          pkg-config --modversion sdl2 sdl2_image sdl2_mixer 2>/dev/null | paste -sd "," - | sed 's/^/pkg-config: /' | tee -a build/deps_macos.txt

      - name: Show SDL2 version (macOS)
        if: runner.os == 'macOS'
        run: |
          set -Eeuo pipefail
          echo "pkg-config versions:"
          pkg-config --modversion sdl2 || true
          pkg-config --modversion sdl2_image || true
          pkg-config --modversion sdl2_mixer || true
          echo "brew info (sdl2):"
          brew info sdl2 | sed -n '1,3p' || true

      - name: Configure (CMake, Ninja)
        shell: bash
        run: |
          set -Eeuo pipefail
          CONF_LOG="build/configure_${{ matrix.os }}_${{ matrix.compiler }}_${{ matrix.build_type }}.log"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -G Ninja -S . -B build \
              -DROGUE_ENABLE_SDL=${ROGUE_ENABLE_SDL} \
              -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" | tee "$CONF_LOG"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            BREW_PREFIX=$(brew --prefix)
            # Include keg-only pkg-config dirs for SDL2 and companions
            export PKG_CONFIG_PATH="$BREW_PREFIX/lib/pkgconfig:$BREW_PREFIX/opt/sdl2/lib/pkgconfig:$BREW_PREFIX/opt/sdl2_image/lib/pkgconfig:$BREW_PREFIX/opt/sdl2_mixer/lib/pkgconfig:$PKG_CONFIG_PATH"
            cmake -G Ninja -S . -B build \
              -DROGUE_ENABLE_SDL=${ROGUE_ENABLE_SDL} \
              -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DROGUE_WARNINGS_AS_ERRORS=OFF \
              -DCMAKE_PREFIX_PATH="$BREW_PREFIX" | tee "$CONF_LOG"
          else
            # Select compiler on Linux based on matrix.compiler
            if [ "${COMPILER}" = "clang" ]; then
              export CC=clang
            else
              export CC=gcc
            fi
            cmake -G Ninja -S . -B build \
              -DROGUE_ENABLE_SDL=${ROGUE_ENABLE_SDL} \
              -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DROGUE_WARNINGS_AS_ERRORS=OFF | tee "$CONF_LOG"
          fi

      - name: Upload CMake configure logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-configure-logs-${{ matrix.os }}
          path: |
            build/CMakeCache.txt
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log

      - name: Build (-j12)
        run: |
          set -Eeuo pipefail
          if [ -n "$CI_DEBUG" ] && [ "$CI_DEBUG" = "1" ]; then
            cmake --build build --parallel 12 -- -v | tee build/build_${{ matrix.os }}_${{ matrix.compiler }}_${{ matrix.build_type }}.log
          else
            cmake --build build --parallel 12 | tee build/build_${{ matrix.os }}_${{ matrix.compiler }}_${{ matrix.build_type }}.log
          fi
        shell: bash

      - name: Run Tests (ctest -j12)
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "Adding SDL2 runtime to PATH via GITHUB_PATH"
            echo "$VCPKG_ROOT/installed/x64-windows/bin" >> "$GITHUB_PATH"
            ctest --test-dir build -C ${BUILD_TYPE} -j 12 --output-on-failure --timeout 300
          elif [ "$RUNNER_OS" = "Linux" ]; then
            # Use Xvfb for headless display, if any tests require it
            xvfb-run -a ctest --test-dir build -C ${BUILD_TYPE} -j 12 --output-on-failure --timeout 300
          else
            ctest --test-dir build -C ${BUILD_TYPE} -j 12 --output-on-failure --timeout 300
          fi

      - name: Collect Metrics
        if: always()
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci/collect-metrics.ps1 -BuildDir build -OutDir build/metrics -WriteGithubSummary

      - name: Categorize Failures
        if: failure()
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci/categorize-failures.ps1 -BuildDir build -OutDir build/failure_report -WriteGithubSummary

      - name: Portability scan (path separators)
        if: always()
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/normalize_paths.ps1 -Root . -CheckOnly || echo "Portability scan found issues (advisory)."

      - name: Portability pattern scan (advisory)
        if: always()
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/portability_scan.ps1 -Root . || echo "Pattern scan completed."

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.short_sha }}
          path: |
            build/ctest_*.log
            build/*.log
            build/deps_*.txt
            build/metrics
            build/failure_report
        timeout-minutes: 10

      # Share Release build directory for packaging job to avoid redundant rebuilds
      - name: Upload Release build directory (for packaging reuse)
        if: ${{ matrix.build_type == 'Release' }}
        uses: actions/upload-artifact@v4
        with:
          name: builddir-${{ matrix.os }}-release-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.short_sha }}
          path: build/**

      - name: Comment failure summary on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'CI failure categorization (auto):\n\n';
            const p = 'build/failure_report/summary.txt';
            if (fs.existsSync(p)) {
              body += '````\n' + fs.readFileSync(p, 'utf8') + '\n````';
            } else {
              body += '_No failure summary available (logs not found)._';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Run clang-tidy (Linux, broadened via compile_commands.json; non-blocking)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          echo "Running clang-tidy on a broader subset using compile_commands.json context..."
          # Limit to 200 files for time; still advisory
          find src -type f -name "*.c" | head -n 200 | xargs -I{} bash -c 'clang-tidy -p build "{}" || true'

      - name: Run clang-tidy (macOS, broadened via compile_commands.json; non-blocking)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          echo "Running clang-tidy on a broader subset using compile_commands.json context..."
          find src -type f -name "*.c" | head -n 200 | xargs -I{} bash -c 'clang-tidy -p build "{}" || true'

      - name: Format Check (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build --config ${{ env.BUILD_TYPE }} --target format-check
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Format check failed. Run: cmake --build build --target format"
            exit 1
          }

      - name: Run clang-tidy (Windows, broadened via compile_commands.json; non-blocking)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host "Running clang-tidy on a broader subset using compile_commands.json context..."
          Get-ChildItem -Recurse src -Filter *.c | Select-Object -First 200 | ForEach-Object { clang-tidy -p build $_.FullName 2>$null }

  docs:
    name: Build Docs (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 10
    needs: [build-and-test]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: ver
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci/compute-version.ps1 -OutDir build -WriteGithubOutputs

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v1

      - name: Install SDL via vcpkg (x64-windows)
        shell: pwsh
        run: |
          $vcpkgExe = "C:\\vcpkg\\vcpkg.exe"
          if (-Not (Test-Path $vcpkgExe)) {
            Write-Host "vcpkg not found at C:\\vcpkg; installing via git clone..."
            git clone https://github.com/microsoft/vcpkg C:\\vcpkg
            & C:\\vcpkg\\bootstrap-vcpkg.bat
          }
          & $vcpkgExe version
          & $vcpkgExe install sdl2 sdl2-image sdl2-mixer --triplet x64-windows

      - name: Install Doxygen and Graphviz
        shell: pwsh
        run: |
          choco install -y doxygen.portable graphviz || echo "doxygen/graphviz already installed"
          doxygen -v

      - name: Configure (SDL ON for docs)
        run: >-
          cmake -S . -B build -DROGUE_ENABLE_SDL=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake

      - name: Generate Doxygen docs
        run: cmake --build build --target docs --config Debug --parallel 12
        continue-on-error: true

      - name: Upload Pages artifact (docs html)
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/html

      - name: Upload HTML docs artifact (debug convenience)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: build/docs/html

  deploy-pages:
    name: Deploy Docs to GitHub Pages
    needs: [docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v4
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment

  package-release:
    name: Package Release Artifacts (${{ matrix.os }})
    needs: [build-and-test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: ver
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci/compute-version.ps1 -OutDir build -WriteGithubOutputs

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v1

      # Try to reuse the Release build directory produced in the build-and-test job
      - name: Download Release build directory artifact
        uses: actions/download-artifact@v4
        with:
          name: builddir-${{ matrix.os }}-release-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.short_sha }}
          path: build
        continue-on-error: true

      # Fallback: if artifact not found (e.g., matrix mismatch), perform a fresh Release configure+build
      - name: Fallback Configure+Build (Release)
        if: always()
        shell: bash
        timeout-minutes: 25
        run: |
          set -Eeuo pipefail
          if [ -f build/CPackConfig.cmake ]; then
            echo "Found existing build/CPackConfig.cmake; skipping fallback configure+build."
            exit 0
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            VCPKG_TEMP="$RUNNER_TEMP/vcpkg"
            if [ ! -d "$VCPKG_TEMP" ]; then
              git clone https://github.com/microsoft/vcpkg "$VCPKG_TEMP"
              "$VCPKG_TEMP/bootstrap-vcpkg.bat"
            fi
            cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release -DROGUE_ENABLE_SDL=ON -DCMAKE_TOOLCHAIN_FILE="$VCPKG_TEMP/scripts/buildsystems/vcpkg.cmake"
          elif [ "$RUNNER_OS" = "Linux" ]; then
          timeout 10m sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          timeout 10m sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y cmake ninja-build
            cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release -DROGUE_ENABLE_SDL=ON
          else
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          brew update && brew install cmake ninja || true
            cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release -DROGUE_ENABLE_SDL=ON
          fi
          cmake --build build --parallel 12 | tee build/build_release_${{ matrix.os }}.log

      - name: Package with CPack
        timeout-minutes: 20
        run: |
          set -Eeuo pipefail
          cmake --install build --config Release --prefix build/_staging | tee build/install_${{ matrix.os }}.log
          (cd build && cpack -C Release | tee cpack_${{ matrix.os }}.log)

      - name: Upload packages and logs
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.short_sha }}
          path: |
            build/*.zip
            build/*.tgz
            build/*.log

  publish-release:
    name: Publish GitHub Release
    needs: [package-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version and notes
        id: ver
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci/compute-version.ps1 -OutDir build -WriteGithubOutputs

      - name: Download packaged artifacts (all OS)
        uses: actions/download-artifact@v4
        with:
          path: build/artifacts
          pattern: packages-*
          merge-multiple: true

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Roguelike ${{ github.ref_name }}
          body_path: build/release_notes.md
          files: |
            build/artifacts/**/*
            build/*.log
