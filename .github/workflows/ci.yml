name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
# Required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }} | ${{ matrix.build_type }} | ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows (MSVC)
          - os: windows-latest
            build_type: Debug
            compiler: msvc
          - os: windows-latest
            build_type: Release
            compiler: msvc
          # Ubuntu (GCC)
          - os: ubuntu-latest
            build_type: Debug
            compiler: gcc
          - os: ubuntu-latest
            build_type: Release
            compiler: gcc
          # Ubuntu 24.04 (GCC)
          - os: ubuntu-24.04
            build_type: Debug
            compiler: gcc
          - os: ubuntu-24.04
            build_type: Release
            compiler: gcc
          # Ubuntu 22.04 (GCC)
          - os: ubuntu-22.04
            build_type: Debug
            compiler: gcc
          - os: ubuntu-22.04
            build_type: Release
            compiler: gcc
          # Ubuntu (Clang)
          - os: ubuntu-latest
            build_type: Debug
            compiler: clang
          - os: ubuntu-latest
            build_type: Release
            compiler: clang
          # Ubuntu 24.04 (Clang)
          - os: ubuntu-24.04
            build_type: Debug
            compiler: clang
          - os: ubuntu-24.04
            build_type: Release
            compiler: clang
          # Ubuntu 22.04 (Clang)
          - os: ubuntu-22.04
            build_type: Debug
            compiler: clang
          - os: ubuntu-22.04
            build_type: Release
            compiler: clang
          # macOS (Clang)
          - os: macos-latest
            build_type: Debug
            compiler: clang
          - os: macos-latest
            build_type: Release
            compiler: clang
          # macOS 15 (Apple Silicon)
          - os: macos-15
            build_type: Debug
            compiler: clang
          - os: macos-15
            build_type: Release
            compiler: clang
          # macOS 14 (Apple Silicon)
          - os: macos-14
            build_type: Debug
            compiler: clang
          - os: macos-14
            build_type: Release
            compiler: clang
          # macOS (Intel) for broader coverage when available
          - os: macos-13
            build_type: Debug
            compiler: clang
          - os: macos-13
            build_type: Release
            compiler: clang
    env:
      BUILD_TYPE: ${{ matrix.build_type }}
      COMPILER: ${{ matrix.compiler }}
      ROGUE_ENABLE_SDL: ON
      CMAKE_BUILD_PARALLEL_LEVEL: "12" # Ensure full parallelism for CMake builds across all runners
      CI_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List CI scripts (debug)
        shell: pwsh
        run: Get-ChildItem -Recurse scripts/ci | ForEach-Object { Write-Host $_.FullName }

      - name: Compute version
        id: ver
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/ci/compute-version.ps1 -OutDir build -WriteGithubOutputs

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v1

      - name: Cache CMake build (per-OS/Compiler/Config)
        uses: actions/cache@v4
        with:
          path: |
            build
          key: ${{ runner.os }}-cmake-${{ env.BUILD_TYPE }}-${{ env.COMPILER }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**', 'tests/**') }}
          restore-keys: |
            ${{ runner.os }}-cmake-${{ env.BUILD_TYPE }}-${{ env.COMPILER }}-

      - name: Cache ccache (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ env.BUILD_TYPE }}-${{ env.COMPILER }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**', 'tests/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ env.BUILD_TYPE }}-${{ env.COMPILER }}-

      # Windows-specific setup
      - name: Setup MSVC Developer Command Prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # (Windows) Switch to Visual Studio generator (MSBuild); Ninja no longer required.
      # Removed Ninja installation to reduce setup time. clang-tidy still works via
      # CMAKE_EXPORT_COMPILE_COMMANDS=ON (added in configure step below).
      - name: Show MSVC Version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cl /?

      - name: Install clang-format (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y llvm || echo "llvm already installed"
          if (Get-Command clang-format -ErrorAction SilentlyContinue) { clang-format --version }

      # Vendored SDL2 is used on Windows; no package manager installation required.

      # Ubuntu-specific setup
      - name: Install Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          set -Eeuo pipefail
          mkdir -p build
          export DEBIAN_FRONTEND=noninteractive
          # Apply retries and network timeouts to avoid indefinite stalls
          timeout 10m sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update 2>&1 | tee build/deps_linux.txt
          timeout 20m sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y cmake ninja-build build-essential pkg-config ccache clang clang-tidy \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev \
            gcovr cppcheck \
            xvfb 2>&1 | tee -a build/deps_linux.txt
          echo "-- Versions --" | tee -a build/deps_linux.txt
          cmake --version | tee -a build/deps_linux.txt
          ninja --version | tee -a build/deps_linux.txt
          gcc --version | head -n1 | tee -a build/deps_linux.txt || true
          clang --version | head -n1 | tee -a build/deps_linux.txt || true
          pkg-config --modversion sdl2 sdl2_image sdl2_mixer 2>/dev/null | paste -sd "," - | sed 's/^/pkg-config: /' | tee -a build/deps_linux.txt

      - name: Show SDL2 version (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          set -Eeuo pipefail
          echo "pkg-config versions:"
          pkg-config --modversion sdl2 || true
          pkg-config --modversion sdl2_image || true
          pkg-config --modversion sdl2_mixer || true
          echo "sdl2-config (if present):"
          sdl2-config --version || true

      # macOS-specific setup
      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          set -Eeuo pipefail
          mkdir -p build
          # Reduce flakiness and long updates during CI
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          export HOMEBREW_NO_ENV_HINTS=1
          brew update 2>&1 | tee build/deps_macos.txt
          brew install cmake ninja sdl2 sdl2_image sdl2_mixer ccache llvm pkg-config 2>&1 | tee -a build/deps_macos.txt || true
          echo "-- Versions --" | tee -a build/deps_macos.txt
          cmake --version | tee -a build/deps_macos.txt
          ninja --version | tee -a build/deps_macos.txt
          clang --version | head -n1 | tee -a build/deps_macos.txt || true
          pkg-config --modversion sdl2 sdl2_image sdl2_mixer 2>/dev/null | paste -sd "," - | sed 's/^/pkg-config: /' | tee -a build/deps_macos.txt

      - name: Show SDL2 version (macOS)
        if: runner.os == 'macOS'
        run: |
          set -Eeuo pipefail
          echo "pkg-config versions:"
          pkg-config --modversion sdl2 || true
          pkg-config --modversion sdl2_image || true
          pkg-config --modversion sdl2_mixer || true
          echo "brew info (sdl2):"
          brew info sdl2 | sed -n '1,3p' || true

      # Windows-only: purge any stale CMake cache files that may reference a vcpkg toolchain
      # from a previous run (CMAKE_TOOLCHAIN_FILE in CMakeCache.txt and CMakeSystem.cmake).
      - name: Purge stale CMake cache/toolchain (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -d build ]; then
            rm -f build/CMakeCache.txt || true
            rm -rf build/CMakeFiles || true
          fi

      - name: Configure (CMake)
        shell: bash
        run: |
          set -Eeuo pipefail
          CONF_LOG="build/configure_${{ matrix.os }}_${{ matrix.compiler }}_${{ matrix.build_type }}.log"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S . -B build \
              -G "Visual Studio 17 2022" -A x64 \
              -DROGUE_ENABLE_SDL=${ROGUE_ENABLE_SDL} \
              -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DROGUE_PREFER_VENDORED_SDL=ON \
              -DCMAKE_TOOLCHAIN_FILE= \
              -DVCPKG_ROOT= \
              -DVCPKG_TARGET_TRIPLET= | tee "$CONF_LOG"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            BREW_PREFIX=$(brew --prefix)
            # Include keg-only pkg-config dirs for SDL2 and companions
            export PKG_CONFIG_PATH="$BREW_PREFIX/lib/pkgconfig:$BREW_PREFIX/opt/sdl2/lib/pkgconfig:$BREW_PREFIX/opt/sdl2_image/lib/pkgconfig:$BREW_PREFIX/opt/sdl2_mixer/lib/pkgconfig:$PKG_CONFIG_PATH"
            cmake -G Ninja -S . -B build \
              -DROGUE_ENABLE_SDL=${ROGUE_ENABLE_SDL} \
              -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DROGUE_WARNINGS_AS_ERRORS=OFF \
              -DCMAKE_PREFIX_PATH="$BREW_PREFIX" | tee "$CONF_LOG"
          else
            # Select compiler on Linux based on matrix.compiler
            if [ "${COMPILER}" = "clang" ]; then
              export CC=clang
            else
              export CC=gcc
            fi
            cmake -G Ninja -S . -B build \
              -DROGUE_ENABLE_SDL=${ROGUE_ENABLE_SDL} \
              -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DROGUE_WARNINGS_AS_ERRORS=OFF | tee "$CONF_LOG"
          fi

      - name: Upload CMake configure logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-configure-logs-${{ matrix.os }}
          path: |
            build/CMakeCache.txt
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log

      - name: Build (-j12)
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Use multi-config build; specify configuration explicitly.
            if [ -n "$CI_DEBUG" ] && [ "$CI_DEBUG" = "1" ]; then
              cmake --build build --config ${BUILD_TYPE} --parallel 12 -- -v | tee build/build_${{ matrix.os }}_${{ matrix.compiler }}_${{ matrix.build_type }}.log
            else
              cmake --build build --config ${BUILD_TYPE} --parallel 12 | tee build/build_${{ matrix.os }}_${{ matrix.compiler }}_${{ matrix.build_type }}.log
            fi
          else
            if [ -n "$CI_DEBUG" ] && [ "$CI_DEBUG" = "1" ]; then
              cmake --build build --parallel 12 -- -v | tee build/build_${{ matrix.os }}_${{ matrix.compiler }}_${{ matrix.build_type }}.log
            else
              cmake --build build --parallel 12 | tee build/build_${{ matrix.os }}_${{ matrix.compiler }}_${{ matrix.build_type }}.log
            fi
          fi

      - name: Run Tests (ctest -j12)
        id: ctest
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
        continue-on-error: ${{ matrix.build_type == 'Release' }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ctest --test-dir build -C ${BUILD_TYPE} -j 12 --output-on-failure --timeout 300
          elif [ "$RUNNER_OS" = "Linux" ]; then
            # Use Xvfb for headless display, if any tests require it
            xvfb-run -a ctest --test-dir build -C ${BUILD_TYPE} -j 12 --output-on-failure --timeout 300
          else
            ctest --test-dir build -C ${BUILD_TYPE} -j 12 --output-on-failure --timeout 300
          fi

      - name: Summarize Release test failures (non-blocking)
        if: ${{ matrix.build_type == 'Release' && steps.ctest.outcome == 'failure' }}
        shell: bash
        run: |
          {
            echo "## Release tests failed (non-blocking)"
            echo "OS: $RUNNER_OS  | Compiler: $COMPILER  | Build: $BUILD_TYPE"
            echo "Packaging will proceed. See uploaded logs artifacts for details."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Asset Validation (Phase 5)
        shell: bash
        run: |
          echo "Running asset_validate CLI (manifest + heuristics)"
          if [ -f build/asset_validate ]; then
            build/asset_validate --manifest build/asset_manifest_ci.txt --optimize || true
          elif [ -f build/asset_validate.exe ]; then
            build/asset_validate.exe --manifest build/asset_manifest_ci.txt --optimize || true
          elif [ -f build/Debug/asset_validate.exe ]; then
            build/Debug/asset_validate.exe --manifest build/asset_manifest_ci.txt --optimize || true
          else
            echo "asset_validate tool not found (skipping)"
          fi

      - name: Collect Metrics
        if: always()
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci/collect-metrics.ps1 -BuildDir build -OutDir build/metrics -WriteGithubSummary

      - name: Categorize Failures
        if: failure()
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci/categorize-failures.ps1 -BuildDir build -OutDir build/failure_report -WriteGithubSummary

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.short_sha }}
          path: |
            build/ctest_*.log
            build/*.log
            build/deps_*.txt
            build/metrics
            build/failure_report
        timeout-minutes: 10

      # Share Release build directory for packaging job to avoid redundant rebuilds
      - name: Upload Release build directory (for packaging reuse)
        if: ${{ matrix.build_type == 'Release' }}
        uses: actions/upload-artifact@v4
        with:
          name: builddir-${{ matrix.os }}-${{ matrix.compiler }}-release-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.short_sha }}
          path: build/**

      - name: Comment failure summary on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'CI failure categorization (auto):\n\n';
            const p = 'build/failure_report/summary.txt';
            if (fs.existsSync(p)) {
              body += '````\n' + fs.readFileSync(p, 'utf8') + '\n````';
            } else {
              body += '_No failure summary available (logs not found)._';
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Run clang-tidy (Linux, broadened via compile_commands.json; non-blocking)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          echo "Running clang-tidy on a broader subset using compile_commands.json context..."
          # Limit to 200 files for time; still advisory
          find src -type f -name "*.c" | head -n 200 | xargs -I{} bash -c 'clang-tidy -p build "{}" || true'

      - name: Run clang-tidy (macOS, broadened via compile_commands.json; non-blocking)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          echo "Running clang-tidy on a broader subset using compile_commands.json context..."
          find src -type f -name "*.c" | head -n 200 | xargs -I{} bash -c 'clang-tidy -p build "{}" || true'

      - name: Run clang-tidy (Windows, broadened via compile_commands.json; non-blocking)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host "Running clang-tidy on a broader subset using compile_commands.json context..."
          Get-ChildItem -Recurse src -Filter *.c | Select-Object -First 200 | ForEach-Object { clang-tidy -p build $_.FullName 2>$null }

  coverage-linux:
    name: Coverage & Static Analysis (ubuntu-latest | gcc | Debug)
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: always()
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies (Ubuntu)
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          mkdir -p build
          export DEBIAN_FRONTEND=noninteractive
          timeout 10m sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update 2>&1 | tee build/deps_linux_cov.txt
          timeout 20m sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y cmake ninja-build gcc g++ pkg-config \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev \
            gcovr cppcheck xvfb 2>&1 | tee -a build/deps_linux_cov.txt
          cmake --version | tee -a build/deps_linux_cov.txt
          gcovr --version | tee -a build/deps_linux_cov.txt || true
          cppcheck --version | tee -a build/deps_linux_cov.txt || true

      - name: Configure (CMake with coverage flags)
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          export CC=gcc
          cmake -G Ninja -S . -B build \
            -DROGUE_ENABLE_SDL=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DROGUE_WARNINGS_AS_ERRORS=OFF \
            -DCMAKE_C_FLAGS="--coverage -O0" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DCMAKE_SHARED_LINKER_FLAGS="--coverage"

      - name: Build (coverage)
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          cmake --build build --parallel 12

      - name: Run Tests (ctest -j12)
        continue-on-error: true
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          set -Eeuo pipefail
          xvfb-run -a ctest --test-dir build -C Debug -j 12 --output-on-failure --timeout 300

      - name: Generate coverage report (gcovr XML + HTML)
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          mkdir -p build/coverage
          gcovr -r . \
            --exclude-directories build \
            --exclude '.*tests/.*' \
            --exclude '.*third_party/.*' \
            --exclude '.*vcpkg/.*' \
            --xml -o build/coverage/coverage.xml \
            --html-details build/coverage/coverage.html \
            --print-summary || true

      - name: Upload coverage artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-artifacts-ubuntu-gcc-debug
          path: |
            build/coverage/coverage.xml
            build/coverage/coverage.html

      - name: Upload to Codecov (non-blocking)
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/coverage/coverage.xml
          flags: unittests
          name: codecov-ubuntu-gcc-debug
          fail_ci_if_error: false
          verbose: true

      - name: Run cppcheck (non-blocking)
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          mkdir -p build/static
          # Analyze only src/; ignore build and third_party
          cppcheck --enable=warning,style,performance,portability --inline-suppr --inconclusive \
            -q -i third_party -i build -i vcpkg --std=c11 src 2> build/static/cppcheck.txt || true

      - name: Upload cppcheck report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-ubuntu-gcc-debug
          path: |
            build/static/cppcheck.txt

  docs:
    name: Build Docs (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 10
    needs: [build-and-test]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List CI scripts (debug)
        shell: pwsh
        run: Get-ChildItem -Recurse scripts/ci | ForEach-Object { Write-Host $_.FullName }

      - name: Compute version
        id: ver
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/ci/compute-version.ps1 -OutDir build -WriteGithubOutputs

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v1

      - name: Install Doxygen and Graphviz
        shell: pwsh
        run: |
          choco install -y doxygen.portable graphviz || echo "doxygen/graphviz already installed"
          doxygen -v

      - name: Purge stale CMake cache/toolchain (Windows)
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -d build ]; then
            rm -f build/CMakeCache.txt || true
            rm -rf build/CMakeFiles || true
          fi

      - name: Configure (SDL ON for docs)
        run: >-
          cmake -S . -B build -DROGUE_ENABLE_SDL=ON -DROGUE_PREFER_VENDORED_SDL=ON -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_TOOLCHAIN_FILE=
          -DVCPKG_ROOT=
          -DVCPKG_TARGET_TRIPLET=

      - name: Generate Doxygen docs
        run: cmake --build build --target docs --config Debug --parallel 12
        continue-on-error: true

      - name: Ensure docs html directory (placeholder if generation failed)
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path build/docs/html)) {
            New-Item -ItemType Directory -Path build/docs/html -Force | Out-Null
          }
          if (-not (Test-Path build/docs/html/index.html)) {
            Set-Content -Path build/docs/html/index.html -Value '<html><body><h1>Documentation Placeholder</h1><p>Doxygen generation failed; placeholder artifact created to satisfy pages deploy.</p></body></html>' -Encoding UTF8
          }

      - name: Upload Pages artifact (docs html)
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/html

      - name: Upload HTML docs artifact (debug convenience)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: build/docs/html

  deploy-pages:
    name: Deploy Docs to GitHub Pages
    needs: [docs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v4
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment

  package-release:
    name: Package Release Artifacts (${{ matrix.os }})
    needs: [build-and-test]
    if: always()
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            compiler: msvc
          - os: ubuntu-latest
            compiler: gcc
          - os: ubuntu-latest
            compiler: clang
          - os: ubuntu-22.04
            compiler: gcc
          - os: ubuntu-22.04
            compiler: clang
          - os: macos-latest
            compiler: clang
          - os: macos-13
            compiler: clang
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List CI scripts (debug)
        shell: pwsh
        run: Get-ChildItem -Recurse scripts/ci | ForEach-Object { Write-Host $_.FullName }

      - name: Compute version
        id: ver
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/ci/compute-version.ps1 -OutDir build -WriteGithubOutputs

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v1

      # Ensure Windows packaging prerequisites are present for MSI generation
      - name: Install WiX Toolset (Windows MSI packaging)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y wixtoolset || echo "WiX already installed"

      # Try to reuse the Release build directory produced in the build-and-test job
      - name: Download Release build directory artifact
        id: dl_release
        uses: actions/download-artifact@v4
        with:
          name: builddir-${{ matrix.os }}-${{ matrix.compiler }}-release-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.short_sha }}
          path: build
        continue-on-error: true

      - name: Package with CPack
        if: ${{ steps.dl_release.outcome == 'success' }}
        shell: bash
        timeout-minutes: 20
        run: |
          set -Eeuo pipefail
          cmake --install build --config Release --prefix build/_staging | tee build/install_${{ matrix.os }}.log
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Generate ZIP, TGZ, and MSI via WIX when available
            (cd build && cpack -C Release -D CPACK_GENERATOR="ZIP;TGZ;WIX" | tee cpack_${{ matrix.os }}.log)
          else
            (cd build && cpack -C Release | tee cpack_${{ matrix.os }}.log)
          fi

      - name: Upload packages and logs
        if: ${{ steps.dl_release.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}-${{ matrix.compiler }}-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.short_sha }}
          path: |
            build/*.zip
            build/*.tgz
            build/*.tar.gz
            build/*.7z
            build/*.msi
            build/*.exe
            build/*.dmg
            build/*.pkg
            build/*.deb
            build/*.rpm
            build/*.AppImage
            build/*.log

  publish-release:
    name: Publish GitHub Release (attach all successful packages)
    needs: [package-release]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List CI scripts (debug)
        shell: pwsh
        run: Get-ChildItem -Recurse scripts/ci | ForEach-Object { Write-Host $_.FullName }

      - name: Compute version and notes
        id: ver
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/ci/compute-version.ps1 -OutDir build -WriteGithubOutputs

      - name: Download packaged artifacts (all OS)
        uses: actions/download-artifact@v4
        with:
          path: build/artifacts
          pattern: packages-*
          merge-multiple: true

      - name: Check that artifacts exist
        id: have_artifacts
        run: |
          set -Eeuo pipefail
          COUNT=$(find build/artifacts -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "Found $COUNT artifact files"
          if [ "$COUNT" -gt 0 ]; then
            echo "any=true" >> $GITHUB_OUTPUT
          else
            echo "any=false" >> $GITHUB_OUTPUT
          fi

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        if: steps.have_artifacts.outputs.any == 'true'
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Roguelike v${{ steps.ver.outputs.version }}
          body_path: build/release_notes.md
          prerelease: ${{ steps.ver.outputs.is_prerelease == 'true' }}
          files: |
            build/artifacts/**/*
            build/*.log

      - name: Skip release (no artifacts found)
        if: steps.have_artifacts.outputs.any != 'true'
        run: |
          echo "No artifacts found to publish; skipping release creation" >> "$GITHUB_STEP_SUMMARY"
