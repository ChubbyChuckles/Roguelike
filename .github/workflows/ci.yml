name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }} | ${{ matrix.build_type }} | ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows (MSVC)
          - os: windows-latest
            build_type: Debug
            compiler: msvc
          - os: windows-latest
            build_type: Release
            compiler: msvc
          # Ubuntu (GCC)
          - os: ubuntu-latest
            build_type: Debug
            compiler: gcc
          - os: ubuntu-latest
            build_type: Release
            compiler: gcc
          # Ubuntu (Clang)
          - os: ubuntu-latest
            build_type: Debug
            compiler: clang
          - os: ubuntu-latest
            build_type: Release
            compiler: clang
          # macOS (Clang)
          - os: macos-latest
            build_type: Debug
            compiler: clang
          - os: macos-latest
            build_type: Release
            compiler: clang
    env:
      BUILD_TYPE: ${{ matrix.build_type }}
      COMPILER: ${{ matrix.compiler }}
      ROGUE_ENABLE_SDL: ON
      VCPKG_ROOT: C:\vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v1

      - name: Cache CMake build (per-OS/Compiler/Config)
        uses: actions/cache@v4
        with:
          path: |
            build
          key: ${{ runner.os }}-cmake-${{ env.BUILD_TYPE }}-${{ env.COMPILER }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**', 'tests/**') }}
          restore-keys: |
            ${{ runner.os }}-cmake-${{ env.BUILD_TYPE }}-${{ env.COMPILER }}-

      # Windows-specific setup
      - name: Setup MSVC Developer Command Prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install -y ninja || echo "ninja already installed"

      - name: Install clang-format (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y llvm || echo "llvm already installed"
          if (Get-Command clang-format -ErrorAction SilentlyContinue) { clang-format --version }

      - name: Install SDL via vcpkg (x64-windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Always use a local classic vcpkg instance to avoid manifest-mode-only runner instances
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'vcpkg'
          if (-Not (Test-Path $vcpkgRoot)) {
            git clone https://github.com/microsoft/vcpkg $vcpkgRoot
            & "$vcpkgRoot\bootstrap-vcpkg.bat"
          }
          $env:VCPKG_ROOT = $vcpkgRoot
          $vcpkgExe = Join-Path $env:VCPKG_ROOT 'vcpkg.exe'
          # Persist VCPKG_ROOT for subsequent steps
          "VCPKG_ROOT=$env:VCPKG_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $vcpkgExe version
          & $vcpkgExe install sdl2 sdl2-image sdl2-mixer --triplet $env:VCPKG_DEFAULT_TRIPLET

      - name: Show SDL2 version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkgExe = Join-Path $env:VCPKG_ROOT 'vcpkg.exe'
          & $vcpkgExe list sdl2
          Get-ChildItem "$env:VCPKG_ROOT\installed\x64-windows\bin" -Filter SDL2.dll -ErrorAction SilentlyContinue | Select-Object FullName, Length

      # Ubuntu-specific setup
      - name: Install Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential pkg-config ccache clang clang-tidy \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev \
            xvfb

      - name: Show SDL2 version (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          echo "pkg-config versions:"
          pkg-config --modversion sdl2 || true
          pkg-config --modversion sdl2_image || true
          pkg-config --modversion sdl2_mixer || true
          echo "sdl2-config (if present):"
          sdl2-config --version || true

      # macOS-specific setup
      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake ninja sdl2 sdl2_image sdl2_mixer ccache llvm pkg-config || true

      - name: Show SDL2 version (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "pkg-config versions:"
          pkg-config --modversion sdl2 || true
          pkg-config --modversion sdl2_image || true
          pkg-config --modversion sdl2_mixer || true
          echo "brew info (sdl2):"
          brew info sdl2 | sed -n '1,3p' || true

      - name: Configure (CMake, Ninja)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -G Ninja -S . -B build \
              -DROGUE_ENABLE_SDL=${ROGUE_ENABLE_SDL} \
              -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            BREW_PREFIX=$(brew --prefix)
            # Include keg-only pkg-config dirs for SDL2 and companions
            export PKG_CONFIG_PATH="$BREW_PREFIX/lib/pkgconfig:$BREW_PREFIX/opt/sdl2/lib/pkgconfig:$BREW_PREFIX/opt/sdl2_image/lib/pkgconfig:$BREW_PREFIX/opt/sdl2_mixer/lib/pkgconfig:$PKG_CONFIG_PATH"
            cmake -G Ninja -S . -B build \
              -DROGUE_ENABLE_SDL=${ROGUE_ENABLE_SDL} \
              -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DROGUE_WARNINGS_AS_ERRORS=OFF \
              -DCMAKE_PREFIX_PATH="$BREW_PREFIX"
          else
            # Select compiler on Linux based on matrix.compiler
            if [ "${COMPILER}" = "clang" ]; then
              export CC=clang
            else
              export CC=gcc
            fi
            cmake -G Ninja -S . -B build \
              -DROGUE_ENABLE_SDL=${ROGUE_ENABLE_SDL} \
              -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DROGUE_WARNINGS_AS_ERRORS=OFF
          fi

      - name: Upload CMake configure logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-configure-logs-${{ matrix.os }}
          path: |
            build/CMakeCache.txt
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log

      - name: Build (-j12)
        run: cmake --build build --parallel 12

      - name: Run Tests (ctest -j12)
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "Adding SDL2 runtime to PATH via GITHUB_PATH"
            echo "$VCPKG_ROOT/installed/x64-windows/bin" >> "$GITHUB_PATH"
            ctest --test-dir build -C ${BUILD_TYPE} -j 12 --output-on-failure --timeout 300
          elif [ "$RUNNER_OS" = "Linux" ]; then
            # Use Xvfb for headless display, if any tests require it
            xvfb-run -a ctest --test-dir build -C ${BUILD_TYPE} -j 12 --output-on-failure --timeout 300
          else
            ctest --test-dir build -C ${BUILD_TYPE} -j 12 --output-on-failure --timeout 300
          fi

      - name: Upload CTest logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}
          path: |
            build/Testing/Temporary
            build/ctest_*.log

      - name: Run clang-tidy (Linux, broadened via compile_commands.json; non-blocking)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          echo "Running clang-tidy on a broader subset using compile_commands.json context..."
          # Limit to 200 files for time; still advisory
          find src -type f -name "*.c" | head -n 200 | xargs -I{} bash -c 'clang-tidy -p build "{}" || true'

      - name: Run clang-tidy (macOS, broadened via compile_commands.json; non-blocking)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          echo "Running clang-tidy on a broader subset using compile_commands.json context..."
          find src -type f -name "*.c" | head -n 200 | xargs -I{} bash -c 'clang-tidy -p build "{}" || true'

      - name: Format Check (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build --config ${{ env.BUILD_TYPE }} --target format-check
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Format check failed. Run: cmake --build build --target format"
            exit 1
          }

      - name: Run clang-tidy (Windows, broadened via compile_commands.json; non-blocking)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host "Running clang-tidy on a broader subset using compile_commands.json context..."
          Get-ChildItem -Recurse src -Filter *.c | Select-Object -First 200 | ForEach-Object { clang-tidy -p build $_.FullName 2>$null }

  docs:
    name: Build Docs (windows-latest)
    runs-on: windows-latest
    needs: [build-and-test]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v1

      - name: Install SDL via vcpkg (x64-windows)
        shell: pwsh
        run: |
          $vcpkgExe = "C:\\vcpkg\\vcpkg.exe"
          if (-Not (Test-Path $vcpkgExe)) {
            Write-Host "vcpkg not found at C:\\vcpkg; installing via git clone..."
            git clone https://github.com/microsoft/vcpkg C:\\vcpkg
            & C:\\vcpkg\\bootstrap-vcpkg.bat
          }
          & $vcpkgExe version
          & $vcpkgExe install sdl2 sdl2-image sdl2-mixer --triplet x64-windows

      - name: Install Doxygen and Graphviz
        shell: pwsh
        run: |
          choco install -y doxygen.portable graphviz || echo "doxygen/graphviz already installed"
          doxygen -v

      - name: Configure (SDL ON for docs)
        run: >-
          cmake -S . -B build -DROGUE_ENABLE_SDL=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake

      - name: Generate Doxygen docs
        run: cmake --build build --target docs --config Debug --parallel 12
        continue-on-error: true

      - name: Upload Pages artifact (docs html)
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/html

      - name: Upload HTML docs artifact (debug convenience)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: build/docs/html

  deploy-pages:
    name: Deploy Docs to GitHub Pages
    needs: [docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v4
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
